[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "my-news"
version = "0.1.0"
description = "headless personal news digest generator"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Woody Henderson" }
]
dependencies = [
    "typer>=0.16.0",
    "pydantic>=2.9.0",
    "PyYAML>=6.0.2",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "Jinja2>=3.1.4",
    "weasyprint>=69.0", # nice
    "platformdirs>=4.3.6",
    "truststore>=0.10.4",
    "PyQt6>=6.8.0"
]

[project.scripts]
my-news = "src.cli:app"
my-news-gui = "src.gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "pypdf>=5.0.0",
    "ruff>=0.6.9", # nice
    "mypy>=1.11.2"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
mypy_path = "src"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src"]