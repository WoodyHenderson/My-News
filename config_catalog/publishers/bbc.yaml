- id: "bbc"
  name: "BBC News"
  description: "UK and international news"
  site_url: "https://www.bbc.co.uk/news"

  feeds:
    - id: "front-page"
      name: "Front Page"
      enabled: true
      kind: "feed"
      url: "https://feeds.bbci.co.uk/news/rss.xml"
      site_url: "https://www.bbc.co.uk/news"
      priority_boost: 0.5
      interests:
        - "general-news"
        - "gaming"
        - "ai"
        - "finance"
      fetch_article: "auto"
      categories:
        - "general-news"
        - "world"
        - "uk"

    - id: "technology"
